<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 2급</title>
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한자 2급">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Concept: 서예 연습지 위의 학습 앱. 인디고 잉크, 차가운 종이색, 낙관(붉은 도장)은 로고와 오늘의 한자에만 쓴다. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --surface-2: #f4f5f9;
  --ink: #17203a;
  --ink-2: #566179;
  --ink-3: #78829a;
  --line: #d9dee9;
  --accent: #2d45a8;
  --accent-soft: #e2e7f5;
  --on-accent: #ffffff;
  --seal: #b8372f;
  --good: #1b7a52;
  --good-bg: #daf1e5;
  --bad: #b3372f;
  --bad-bg: #f8e1de;
  --m0: #d3d9e6;
  --m1: #aebcef;
  --m2: #5f79d3;
  --m3: #2d45a8;
  --shadow: 0 8px 28px rgba(23, 32, 58, .18);
  --font-ui: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-han: 'Noto Serif KR', 'AppleMyungjo', 'Batang', 'Hiragino Mincho ProN', 'Songti SC', 'MingLiU', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161e34; --surface-2: #1b2540; --ink: #e8ecf7; --ink-2: #9ba7c2; --ink-3: #7f8bab; --line: #2a3553;
    --accent: #93a8ff; --accent-soft: #232f58; --on-accent: #0e1424; --seal: #e0675d;
    --good: #66d3a3; --good-bg: #15392c; --bad: #ff9088; --bad-bg: #3e1c1c;
    --m0: #2a3553; --m1: #43569a; --m2: #7088dc; --m3: #b3c1ff; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161e34; --surface-2: #1b2540; --ink: #e8ecf7; --ink-2: #9ba7c2; --ink-3: #7f8bab; --line: #2a3553;
  --accent: #93a8ff; --accent-soft: #232f58; --on-accent: #0e1424; --seal: #e0675d;
  --good: #66d3a3; --good-bg: #15392c; --bad: #ff9088; --bad-bg: #3e1c1c;
  --m0: #2a3553; --m1: #43569a; --m2: #7088dc; --m3: #b3c1ff; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; height: 100dvh; max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
.top {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px;
}
.top h1 { margin: 0; font-size: 1.375rem; font-weight: 700; line-height: 1.25; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal {
  width: 32px; height: 32px; border-radius: 6px; background: var(--seal); color: #fff; display: grid; place-items: center;
  font-family: var(--font-han); font-weight: 700; font-size: 1.125rem; line-height: 1;
}
.iconbtn { width: 44px; height: 44px; margin-right: -8px; border: 0; background: none; border-radius: 12px; color: var(--ink-2); display: grid; place-items: center; }
.iconbtn:active { background: var(--accent-soft); }
.view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 28px; outline: none; }
.page { display: grid; gap: 22px; animation: rise .22s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab {
  position: relative; background: none; border: 0; border-radius: 12px; min-height: 54px; padding: 6px 0 4px;
  display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-3); font-size: .6875rem; font-weight: 600;
}
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before { content: ''; position: absolute; top: -7px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.app.immersive .top, .app.immersive .tabbar { display: none; }
.app.immersive .view { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

h2.sec { margin: 0; font-size: .8125rem; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); }
.sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.group { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.muted { color: var(--ink-2); font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: .875rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { color: var(--ink-3); opacity: .6; text-decoration: none; cursor: default; }

/* buttons */
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 14px; min-height: 52px; padding: 0 20px; font-size: 1.0625rem; font-weight: 700; width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sec { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; }
.btn.sm { min-height: 44px; font-size: .9375rem; border-radius: 10px; width: auto; padding: 0 18px; }
.btn.bad { background: var(--surface); color: var(--bad); border: 1.5px solid var(--bad); }
.btn.good { background: var(--good); color: var(--surface); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: grid; gap: 10px; }

/* chips */
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 8px; }
.chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; gap: 1px; min-width: 0; transition: background .15s, border-color .15s; }
.chip b { font-size: 1rem; font-weight: 600; }
.chip span { font-size: .8125rem; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] span { color: inherit; opacity: .85; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 44px; font-weight: 500; font-size: .9375rem; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: default; }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.scroll-x button { flex: none; background: var(--surface); border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 14px; min-height: 38px; font-size: .875rem; font-weight: 500; white-space: nowrap; }
.scroll-x button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* 칸 (연습지 격자) */
.mi { position: relative; width: var(--box, 200px); height: var(--box, 200px); color: var(--line); border: 1.5px solid var(--ink-3); border-radius: 4px; display: grid; place-items: center; flex: none; }
.mi svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mi .g { position: relative; font-family: var(--font-han); font-weight: 500; font-size: calc(var(--box, 200px) * .68); line-height: 1; color: var(--ink); }

/* home */
.hello { margin: 0; font-size: 1.5rem; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.hello-sub { margin: 4px 0 0; color: var(--ink-2); font-size: .9375rem; }
.goal { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.ring .fg.zero { stroke-opacity: 0; }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring .mid b { font-size: 1.625rem; font-weight: 700; }
.ring .mid span { font-size: .75rem; color: var(--ink-2); }
.goal-text { display: grid; gap: 4px; min-width: 0; }
.goal-text b { font-size: 1.0625rem; }
.streak-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: .875rem; color: var(--ink-2); }
.streak-line strong { color: var(--ink); font-weight: 700; }
.today { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; text-align: left; width: 100%; }
.today .stamp { position: relative; }
.today .stamp::after { content: '오늘'; position: absolute; top: -9px; left: -9px; background: var(--seal); color: #fff; font-size: .6875rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
.today-main { display: grid; gap: 6px; min-width: 0; }
.today-mean { font-size: 1.5rem; font-weight: 700; line-height: 1.25; }
.today-hint { color: var(--ink-2); font-size: .875rem; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; text-align: left; align-content: start; min-height: 108px; min-width: 0; }
.tile .t-name { font-size: .9375rem; font-weight: 600; }
.tile .t-n { font-size: 1.75rem; font-weight: 700; line-height: 1.15; color: var(--accent); }
.tile .t-n small { font-size: .875rem; font-weight: 600; margin-left: 2px; }
.tile .t-sub { font-size: .8125rem; color: var(--ink-2); }
.tile.off .t-n { color: var(--ink-3); }
.tile:active { background: var(--accent-soft); }

/* mastery bars */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8125rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.mrows { display: grid; gap: 4px; }
.mrow { display: grid; gap: 6px; background: none; border: 0; padding: 8px 0; text-align: left; border-radius: 8px; width: 100%; }
.mrow-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .875rem; }
.mrow-h b { font-weight: 600; }
.mrow-h span { color: var(--ink-2); font-size: .8125rem; }
.stackbar { display: flex; gap: 2px; height: 12px; }
.stackbar i { display: block; height: 100%; min-width: 4px; }
.stackbar i:first-child { border-radius: 4px 0 0 4px; }
.stackbar i:last-child { border-radius: 0 4px 4px 0; }
.stackbar i:only-child { border-radius: 4px; }
.stackbar.lg { height: 16px; }
.m0 { background: var(--m0); } .m1 { background: var(--m1); } .m2 { background: var(--m2); } .m3 { background: var(--m3); }

/* setup */
.lede { margin: 0; color: var(--ink-2); font-size: .9375rem; }
.sum { margin: 0; text-align: center; font-size: .875rem; color: var(--ink-2); }
.page-title { margin: 0; font-size: 1.375rem; font-weight: 700; }

/* session */
.sbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sbar .iconbtn { margin: 0 0 0 -10px; }
.prog { font-weight: 600; font-variant-numeric: tabular-nums; }
.scorebox { display: flex; gap: 6px; align-items: baseline; color: var(--ink-2); font-size: .9375rem; min-width: 64px; justify-content: flex-end; }
.scorebox b { color: var(--ink); font-weight: 700; }
.streak { color: var(--good); font-weight: 600; font-size: .8125rem; }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 99px; transition: width .25s ease; }
.tmeter { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.tmeter i { display: block; height: 100%; width: 100%; background: var(--ink-3); transform-origin: left; }
.tmeter i.low { background: var(--bad); }
.session { display: grid; gap: 16px; }
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px; display: grid; justify-items: center; align-content: center; gap: 12px; min-height: 200px; --box: min(52vw, 220px); }
.q-label { margin: 0; font-size: .875rem; color: var(--ink-2); font-weight: 500; }
.mean { font-size: clamp(1.75rem, 8vw, 2.5rem); font-weight: 700; line-height: 1.25; text-align: center; text-wrap: balance; padding-block: 18px; }
.opts { display: grid; gap: 10px; }
.opts.han { grid-template-columns: 1fr 1fr; }
.opt { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; min-height: 58px; padding: 10px 14px 10px 46px; text-align: left; font-size: 1.125rem; font-weight: 500; transition: border-color .12s, background .12s, opacity .12s; }
.opt kbd { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font: 600 .75rem var(--font-ui); background: var(--accent-soft); color: var(--accent); }
.opts.han .opt { padding: 8px; min-height: 104px; display: grid; place-items: center; text-align: center; }
.opts.han .opt kbd { left: 8px; top: 8px; translate: none; }
.opt .hg { font-family: var(--font-han); font-size: 3.3rem; line-height: 1.1; font-weight: 500; }
.opt:not(:disabled):active { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.is-correct { background: var(--good-bg); border-color: var(--good); }
.opt.is-correct kbd { background: var(--good); color: var(--surface); }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.is-wrong kbd { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .55; }
.feedback { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.fb-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 180px; }
.fb-status { font-weight: 700; }
.fb-status.ok { color: var(--good); }
.fb-status.no { color: var(--bad); }
.fb-detail { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fb-detail .g { font-family: var(--font-han); font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
.fb-detail .m { color: var(--ink-2); font-size: .9375rem; }
.fcard { width: 100%; min-height: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; display: grid; justify-items: center; align-content: center; gap: 14px; padding: 20px 16px; --box: min(56vw, 230px); }
.fcard .hint { color: var(--ink-3); font-size: .875rem; }
.fcard .back-mean { font-size: clamp(1.75rem, 8vw, 2.25rem); font-weight: 700; text-align: center; line-height: 1.3; text-wrap: balance; }
.fcard .back-sub { color: var(--ink-2); font-size: .9375rem; text-align: center; }
.fcard .back-g { font-family: var(--font-han); font-size: 4rem; line-height: 1.1; }

/* result */
.score-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pct { font-size: 3.5rem; font-weight: 700; line-height: 1; color: var(--accent); }
.pct small { font-size: 1.5rem; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat span { font-size: .8125rem; color: var(--ink-2); }
.stat b { font-size: 1.25rem; font-weight: 700; }
.wrong-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
.w { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; text-align: left; min-width: 0; }
.w .g { font-family: var(--font-han); font-size: 2rem; font-weight: 700; line-height: 1.2; }
.w .m { font-size: .875rem; color: var(--ink-2); overflow-wrap: anywhere; }
.note { margin: 0; padding: 14px 16px; background: var(--good-bg); border-radius: 12px; font-weight: 500; }

/* dictionary */
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--ink-3); width: 20px; height: 20px; }
.search input { width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; padding: 0 14px 0 44px; }
.search input::placeholder { color: var(--ink-3); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.cell { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.cell .g { font-family: var(--font-han); font-size: 2rem; line-height: 1.2; font-weight: 500; }
.cell .m { font-size: .75rem; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .dot { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; border-radius: 50%; }
.cell .star { position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; color: var(--seal); fill: currentColor; }
.cell:active { background: var(--accent-soft); }
.empty { text-align: center; color: var(--ink-2); padding: 36px 8px; }

/* record */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.kpi span { font-size: .8125rem; color: var(--ink-2); }
.kpi b { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.kpi small { font-size: .8125rem; color: var(--ink-2); }
.chart { display: grid; gap: 10px; }
.plot { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.yax { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; height: 120px; font-size: .6875rem; color: var(--ink-3); line-height: 1; padding-block: 0; font-variant-numeric: tabular-nums; }
.cols { position: relative; height: 120px; display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; border-bottom: 1px solid var(--line); }
.cols::before, .cols::after { content: ''; position: absolute; left: 0; right: 0; height: 1px; background: var(--line); opacity: .7; }
.cols::before { top: 0; }
.cols::after { top: 50%; }
.col { position: relative; z-index: 1; background: none; border: 0; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 2px; }
.col .seg-w, .col .seg-c { width: 100%; max-width: 20px; display: block; }
.col .seg-w { background: var(--m1); border-radius: 4px 4px 0 0; }
.col .seg-c { background: var(--accent); }
.col .seg-w + .seg-c { border-radius: 0; }
.col .seg-c:first-child { border-radius: 4px 4px 0 0; }
.col[aria-pressed="true"]::after { content: ''; position: absolute; inset: 0 -2px; background: var(--accent-soft); z-index: -1; border-radius: 6px; }
.xax { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }

    planStart: function (cat) {
      var g = ST.set.newGoal[cat] || 0;
      if (!g) { UI.resetArmed = 0; openSettings(); toast('하루에 새로 외울 양을 정해 주세요.'); return; }
      if (!quota(cat)) { toast('오늘 ' + CATNAME[cat] + ' 분량을 채웠어요. 더 외우려면 학습 탭을 쓰세요.'); return; }
      runPlan(cat);
    },
    applyPace: function () {
      var pp = pacePlan(); if (!pp) return;
      CATS.forEach(function (c) { ST.set.newGoal[c[0]] = pp.goals[c[0]]; });
      save(); render(true); toast('하루 분량을 한자 ' + pp.goals.h + ' · 단어 ' + pp.goals.w + ' · 사자성어 ' + pp.goals.i + '개로 맞췄어요.');
    },
    openItem: function (a) { openDetail(a); var p = $('#panel'); if (p) p.scrollTop = 0; },
    fav: function (a) {
      toggle(ST.fav, a); save();
      if (!$('#sheet').hidden) openDetail(a);
      if (UI.sess && UI.sess.type === 'card' && !C.done) cardRender();
      else if (UI.tab === 'dict') refreshDict();
    },
    missToggle: function (a) {
      var e = ST.s[a] || (ST.s[a] = { b: 0, c: 0, w: 0, t: 0, n: 0 });
      e.m = e.m ? 0 : 1; save(); openDetail(a); if (UI.tab === 'dict') refreshDict();
    },
    /* learn */
    cCat: function (a) { var c = UI.c; c.cat = a; if (c.kind === 'freq' && a !== 'w') c.kind = 'new'; c.face = 'main'; render(true); },
    cFile: function (a) { toggle(UI.c.fl[UI.c.cat], a); render(true); },
    cAll: function () { toggleAll(UI.c.cat, UI.c.fl[UI.c.cat]); render(true); },
    cKind: function (a) { UI.c.kind = a; render(true); },
    cFace: function (a) { UI.c.face = a; render(true); },
    cOrder: function (a) { UI.c.order = a; render(true); },
    cCount: function (a) { UI.c.count = +a; render(true); },
    cQuota: function () { UI.c.count = quota(UI.c.cat); render(true); },
    cStart: function () {
      var c = JSON.parse(JSON.stringify(UI.c));
      var run = function () { startCards(cPool(c), { face: c.face, order: c.order, count: c.count }, run); };
      run();
    },
    /* quiz */
    qCat: function (a) { var q = UI.q; q.cat = a; q.dir = 'mix'; if (q.src === 'freq' && a !== 'w') q.src = 'range'; render(true); },
    qMode: function (a) { UI.q.mode = a; if (a === 'speed' && UI.q.dir === 'type') UI.q.dir = 'mix'; render(true); },
    qSrc: function (a) { UI.q.src = a; render(true); },
    qFile: function (a) { toggle(UI.q.fl[UI.q.cat], a); render(true); },
    qAll: function () { toggleAll(UI.q.cat, UI.q.fl[UI.q.cat]); render(true); },
    qDir: function (a) { UI.q.dir = a; render(true); },
    qCount: function (a) { UI.q.count = +a; render(true); },
    qTime: function (a) { UI.q.time = +a; render(true); },
    qStart: function () {
      var c = JSON.parse(JSON.stringify(UI.q));
      var run = function () { startQuiz(qPool(c), { mode: c.mode, dir: c.dir, count: c.count, time: c.time, pref: c.src === 'range' ? c.fl[c.cat] : null, prefKind: c.cat }, run); };
      run();
    },
    /* dict */
    dCat: function (a) { var d = UI.dict; d.cat = a; d.flt = 'all'; d.rng = 0; d.limit = 90; render(true); },
    dictFlt: function (a) { UI.dict.flt = a; UI.dict.limit = 90; render(true); },
    dictRng: function (a, el) {
      UI.dict.rng = +a; UI.dict.limit = 90;
      if (el && el.dataset.go === 'dict') { UI.dict.cat = el.dataset.cat || 'h'; UI.dict.flt = 'all'; UI.dict.q = ''; go('dict'); } else render(true);
    },
    dictMore: function () { UI.dict.limit += 90; refreshDict(); },
    chartPick: function (a) {
      UI.chartPick = +a; var days = lastDays(14);
      $$('.col').forEach(function (b, i) { b.setAttribute('aria-pressed', String(i === UI.chartPick)); });
      $('#readout').innerHTML = readout(days[UI.chartPick]);
    },
    /* session */
    answer: function (a) { answer(a); },
    typeSubmit: function () { var t = $('#ti'); if (!t || !Q || Q.locked) return; answer(t.value); },
    typeSkip: function () { answer(''); },
    next: function () { nextQ(); },
    quit: function () { var tab = UI.tab; stopLoop(); if (Q) clearTimeout(Q.adv); go(tab); },
    leave: function () { go('home'); },
    again: function () { if (Q && Q.redo) Q.redo(); },
    retryBad: function () {
      var bad = Q.bad.slice(), o = { mode: 'mc', dir: Q.ds, count: 0, time: Q.mode === 'speed' ? 0 : Q.time, pref: null };
      var run = function () { startQuiz(bad, o, run); };
      run();
    },
    cardFlip: function () { if (C && !C.done) { C.flipped = !C.flipped; cardRender(); } },
    cardKnow: function () { cardMark(true); },
    cardDont: function () { cardMark(false); },
    cardAgain: function () { if (C && C.redo) C.redo(); },
    cardQuizBad: function () {
      var bad = C.dont.slice(), o = { mode: 'mc', dir: 'mix', count: 0, time: 0 };
      var run = function () { startQuiz(bad, o, run); };
      run();
    },
    /* settings */
    ng: function (a) {
      var p = a.split(':'), cat = p[0], d = +p[1], cur = ST.set.newGoal[cat] || 0, step = NG_STEP[cat];
      var nv = d > 0 ? (Math.floor(cur / step) + 1) * step : (Math.ceil(cur / step) - 1) * step;
      nv = clampGoal(cat, nv); ST.set.newGoal[cat] = nv; save();
      var inp = $('#ng-' + cat); if (inp) inp.value = nv;
    },
    examClear: function () { ST.set.exam = ''; save(); openSettings(); },
    goal: function (a) { ST.set.goal = +a; save(); openSettings(); },
    revOk: function (a) { ST.set.revOk = +a; save(); openSettings(); },
    theme: function (a) { ST.set.theme = a; save(); applyTheme(); openSettings(); },
    exportData: function () {
      var txt = JSON.stringify(ST);
      var show = function () { $('#bk').innerHTML = '<p>아래 글자를 전부 복사해 두세요.</p><textarea id="bkt" readonly></textarea>'; var t = $('#bkt'); t.value = txt; t.focus(); t.select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('기록을 복사했어요.'); }, show); else show();
    },
    importOpen: function () { $('#bk').innerHTML = '<p>복사해 둔 기록을 붙여 넣으세요. 지금 기록은 덮어써져요.</p><textarea id="bkt"></textarea><button class="btn sm" type="button" data-act="importDo" style="width:100%">복원하기</button>'; $('#bkt').focus(); },
    importDo: function () {
      try {
        var j = JSON.parse($('#bkt').value);
        if (!j || (j.v !== 3 && j.v !== 4) || typeof j.s !== 'object') throw new Error('x');
        ST = Object.assign(freshST(), { s: j.s, fav: j.fav || {}, log: j.log || {}, best80: j.best80 || 0 });
        ST.set = fixSet(j.set); ST.ex = Object.assign({ hist: [], miss: {} }, j.ex || {});
        save(); applyTheme(); sheetClose(); render(); toast('기록을 복원했어요.');
      } catch (e) { toast('기록 형식이 올바르지 않아요.'); }
    },
    resetAsk: function () {
      if (UI.resetArmed) { var keep = ST.set; ST = freshST(); ST.set = keep; save(); UI.resetArmed = 0; sheetClose(); render(); toast('기록을 모두 지웠어요.'); return; }
      UI.resetArmed = 1; openSettings();
      setTimeout(function () { if (UI.resetArmed) { UI.resetArmed = 0; if (!$('#sheet').hidden && $('[data-act="resetAsk"]')) openSettings(); } }, 4000);
    }
  };

  Object.keys(EXACT).forEach(function (k) { ACT[k] = EXACT[k]; });

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (fn) fn(el.dataset.arg, el);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'dq') { UI.dict.q = t.value; UI.dict.limit = 90; refreshDict(); }
    else if (t.classList && t.classList.contains('amt')) {
      var v = parseInt(t.value, 10), o = t.dataset.for === 'e' ? EXUI : UI[t.dataset.for];
      if (v >= 1) o.count = Math.min(999, v);
      softSetup();
    } else if (t.dataset && t.dataset.ng) {
      var cat = t.dataset.ng, nv = clampGoal(cat, t.value);
      if (t.value !== '') { ST.set.newGoal[cat] = nv; save(); }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'exam') { ST.set.exam = t.value || ''; save(); openSettings(); }
    else if (t.dataset && t.dataset.ng) { var cat = t.dataset.ng, nv = clampGoal(cat, t.value); ST.set.newGoal[cat] = nv; t.value = nv; save(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === 'Escape' && !$('#sheet').hidden) { sheetClose(); return; }
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') {
      if (ev.target.id === 'ti' && ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); ACT.typeSubmit(); }
      else if (ev.target.id === 'exi' && ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); if (E && E.instant) ACT.exCheck(); else ACT.exNext(); }
      return;
    }
    if (UI.sess && UI.sess.type === 'exam' && E && !E.done && !E.grading) {
      if (/^[1-4]$/.test(ev.key) && E.qs[E.i].kind === 'mc') { ev.preventDefault(); ACT.exMc(ev.key); }
    } else if (UI.sess && UI.sess.type === 'quiz' && Q && !Q.done) {
      if (!Q.locked && /^[1-4]$/.test(ev.key)) { var b = $$('#opts .opt')[+ev.key - 1]; if (b) { ev.preventDefault(); answer(b.dataset.arg); } }
      else if (Q.locked && (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowRight')) { ev.preventDefault(); nextQ(); }
    } else if (UI.sess && UI.sess.type === 'card' && C && !C.done) {
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (!C.flipped) ACT.cardFlip(); }
      else if (C.flipped && ev.key === 'ArrowRight') { ev.preventDefault(); cardMark(true); }
      else if (C.flipped && ev.key === 'ArrowLeft') { ev.preventDefault(); cardMark(false); }
    }
  });

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>

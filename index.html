<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 뜻맞추기</title>
<meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한자 2급">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Concept: 서예 연습지. 칸이 그어진 종이 위에 한자 한 글자, 아래에 사지선다. 인디고 잉크와 차가운 종이색. */
:root {
  --paper: #eceff4;
  --card: #ffffff;
  --ink: #18223a;
  --ink-2: #566179;
  --line: #d2d9e5;
  --tint: #e2e7f5;
  --accent: #2d45a8;
  --on-accent: #ffffff;
  --good: #1b7a52;
  --good-bg: #daf1e5;
  --bad: #b3372f;
  --bad-bg: #f8e1de;
  --font-ui: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-han: 'Noto Serif KR', 'AppleMyungjo', 'Batang', 'Hiragino Mincho ProN', 'Songti SC', 'MingLiU', serif;
  --box: min(58vw, 232px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1424; --card: #161e34; --ink: #e8ecf7; --ink-2: #9ba7c2; --line: #2a3553; --tint: #1e2847;
    --accent: #93a8ff; --on-accent: #0e1424; --good: #66d3a3; --good-bg: #15392c; --bad: #ff9088; --bad-bg: #3e1c1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1424; --card: #161e34; --ink: #e8ecf7; --ink-2: #9ba7c2; --line: #2a3553; --tint: #1e2847;
  --accent: #93a8ff; --on-accent: #0e1424; --good: #66d3a3; --good-bg: #15392c; --bad: #ff9088; --bad-bg: #3e1c1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 24px 48px; min-height: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin-inline: auto; display: grid; gap: 24px; }
h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.eyebrow { margin: 0 0 6px; font-size: .8125rem; letter-spacing: .08em; color: var(--ink-2); font-weight: 500; }
.lede { margin: 8px 0 0; color: var(--ink-2); font-size: .9375rem; }
.han-mark { font-family: var(--font-han); font-weight: 700; color: var(--accent); }

/* setup */
.group { display: grid; gap: 10px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.label { margin: 0; font-size: .8125rem; font-weight: 600; color: var(--ink-2); letter-spacing: .06em; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: .875rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { color: var(--ink-2); opacity: .5; text-decoration: none; cursor: default; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.chip {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
  text-align: left; display: grid; gap: 2px; min-width: 0; transition: border-color .15s, background .15s;
}
.chip b { font-size: 1.0625rem; font-weight: 600; }
.chip span { font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] span { color: inherit; opacity: .85; }
.chip:disabled { opacity: .5; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 16px; min-height: 44px;
  font-weight: 500; transition: border-color .15s, background .15s;
}
.seg button[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.nb { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nb .chip { flex: 1 1 220px; grid-template-columns: 1fr auto; align-items: center; }
.nb .chip span { font-size: .875rem; }
.start-wrap { display: grid; gap: 8px; }
.primary {
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 14px; min-height: 54px; padding: 0 20px;
  font-size: 1.0625rem; font-weight: 700; letter-spacing: .02em;
}
.primary:disabled { opacity: .45; cursor: default; }
.primary.small { min-height: 44px; font-size: .9375rem; border-radius: 10px; padding: 0 18px; }
.secondary {
  background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; min-height: 50px; padding: 0 18px; font-weight: 600;
}
.sum { margin: 0; text-align: center; font-size: .875rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* play */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ghost { background: none; border: 0; padding: 8px 4px; color: var(--ink-2); font-weight: 500; }
.prog, .scorebox { font-variant-numeric: tabular-nums; font-weight: 600; }
.scorebox { color: var(--ink-2); font-weight: 500; font-size: .9375rem; display: flex; gap: 8px; align-items: baseline; }
.scorebox b { color: var(--ink); font-weight: 700; }
.streak { color: var(--good); font-weight: 600; font-size: .8125rem; }
.meter, .timer { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; border-radius: 99px; }
.timer { height: 4px; margin-top: -14px; }
.timer i { display: block; height: 100%; width: 100%; background: var(--ink-2); transform-origin: left; }
.timer i.low { background: var(--bad); }
#play { display: grid; gap: 18px; }
.q-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px;
  display: grid; justify-items: center; align-content: center; gap: 12px; min-height: 200px;
}
.q-label { margin: 0; font-size: .875rem; color: var(--ink-2); font-weight: 500; }
.mi {
  position: relative; width: var(--box); height: var(--box); color: var(--line);
  border: 1.5px solid var(--ink-2); border-radius: 4px; display: grid; place-items: center;
}
.mi svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mi .g { position: relative; font-family: var(--font-han); font-weight: 500; font-size: calc(var(--box) * .68); line-height: 1; color: var(--ink); }
.mean { font-size: clamp(1.75rem, 8vw, 2.5rem); font-weight: 700; line-height: 1.25; text-align: center; text-wrap: balance; padding-block: 18px; }
.opts { display: grid; gap: 10px; }
.opts.han { grid-template-columns: 1fr 1fr; }
.opt {
  position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; min-height: 58px;
  padding: 10px 14px 10px 44px; text-align: left; font-size: 1.125rem; font-weight: 500; transition: border-color .12s, background .12s, opacity .12s;
}
.opt kbd {
  position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  font: 600 .75rem var(--font-ui); background: var(--tint); color: var(--accent); font-variant-numeric: tabular-nums;
}
.opts.han .opt { padding: 8px; min-height: 108px; display: grid; place-items: center; text-align: center; }
.opts.han .opt kbd { left: 8px; top: 8px; translate: none; }
.opt .hg { font-family: var(--font-han); font-size: 3.4rem; line-height: 1.1; font-weight: 500; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.is-correct { background: var(--good-bg); border-color: var(--good); color: var(--ink); }
.opt.is-correct kbd { background: var(--good); color: var(--card); }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.is-wrong kbd { background: var(--bad); color: var(--card); }
.opt.dim { opacity: .55; }
.feedback { min-height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.fb-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
.fb-status { font-weight: 700; font-size: 1rem; }
.fb-status.ok { color: var(--good); }
.fb-status.no { color: var(--bad); }
.fb-detail { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fb-detail .g { font-family: var(--font-han); font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
.fb-detail .m { color: var(--ink-2); font-size: .9375rem; }

/* result */
#result { display: grid; gap: 22px; }
.score-line { display: flex; align-items: baseline; gap: 8px; }
.pct { font-size: 3.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.pct small { font-size: 1.5rem; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat span { font-size: .8125rem; color: var(--ink-2); }
.stat b { font-size: 1.25rem; font-variant-numeric: tabular-nums; font-weight: 700; }
.wrong-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.w { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.w .g { font-family: var(--font-han); font-size: 2rem; font-weight: 700; line-height: 1.2; }
.w .m { font-size: .875rem; color: var(--ink-2); overflow-wrap: anywhere; }
.actions { display: grid; gap: 10px; }
.perfect { margin: 0; padding: 16px; background: var(--good-bg); border-radius: 12px; color: var(--ink); font-weight: 500; }

@media (min-width: 520px) { .actions { grid-template-columns: 1fr 1fr; } .actions .primary { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
/* 단독 앱용 기본 설정 */
html { -webkit-text-size-adjust: 100%; }
:root { color-scheme: light dark; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
button { touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; }
</style>


</head>
<body>
<div class="wrap">

  <section id="setup" style="display:grid;gap:24px">
    <header>
      <p class="eyebrow">진흥회 한자 2급 대비</p>
      <h1><span class="han-mark">漢字</span> 뜻맞추기</h1>
      <p class="lede" id="lede"></p>
    </header>

    <div class="group">
      <div class="group-head">
        <p class="label">범위</p>
        <button class="link" type="button" id="toggle-all"></button>
      </div>
      <div class="files" id="files"></div>
      <div class="nb">
        <button class="chip" type="button" id="nb" aria-pressed="false"><b>오답 노트로 연습</b><span><span id="nb-count">0</span>자</span></button>
        <button class="link" type="button" id="nb-clear">오답 노트 비우기</button>
      </div>
    </div>

    <div class="group">
      <p class="label">출제 방식</p>
      <div class="seg" role="group" aria-label="출제 방식">
        <button type="button" data-dir="h2m">한자 보고 훈음 고르기</button>
        <button type="button" data-dir="m2h">훈음 보고 한자 고르기</button>
      </div>
    </div>

    <div class="group">
      <p class="label">문제 수</p>
      <div class="seg" role="group" aria-label="문제 수" id="counts">
        <button type="button" data-count="10">10</button>
        <button type="button" data-count="20">20</button>
        <button type="button" data-count="50">50</button>
        <button type="button" data-count="100">100</button>
        <button type="button" data-count="0">전체</button>
      </div>
    </div>

    <div class="group">
      <p class="label">문제당 제한 시간</p>
      <div class="seg" role="group" aria-label="제한 시간">
        <button type="button" data-time="0">없음</button>
        <button type="button" data-time="10">10초</button>
        <button type="button" data-time="5">5초</button>
        <button type="button" data-time="3">3초</button>
      </div>
    </div>

    <div class="start-wrap">
      <button class="primary" type="button" id="start">시작하기</button>
      <p class="sum" id="sum"></p>
    </div>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="ghost" type="button" id="quit">← 그만</button>
      <div class="prog"><span id="pn">1</span> / <span id="pt">20</span></div>
      <div class="scorebox">맞힌 <b id="ps">0</b><span class="streak" id="pstreak" hidden></span></div>
    </div>
    <div class="meter" aria-hidden="true"><i id="pbar"></i></div>
    <div class="timer" id="timer" hidden aria-hidden="true"><i id="tbar"></i></div>
    <div class="q-card" id="qcard"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </section>

  <section id="result" hidden>
    <header>
      <p class="eyebrow">결과</p>
      <div class="score-line"><span class="pct" id="r-pct">0<small>%</small></span><span id="r-frac" class="lede" style="margin:0"></span></div>
    </header>
    <div class="stats">
      <div class="stat"><span>맞힌 문제</span><b id="r-ok">0</b></div>
      <div class="stat"><span>걸린 시간</span><b id="r-time">0:00</b></div>
      <div class="stat"><span>최다 연속</span><b id="r-best">0</b></div>
    </div>
    <div class="group" id="r-wrong-box">
      <p class="label">틀린 한자</p>
      <div class="wrong-grid" id="r-wrong"></div>
    </div>
    <div class="actions">
      <button class="primary" type="button" id="r-retry-wrong">틀린 한자만 다시 풀기</button>
      <button class="secondary" type="button" id="r-again">같은 설정으로 다시</button>
      <button class="secondary" type="button" id="r-home">처음으로</button>
    </div>
  </section>

</div>

      if (t.dataset.armed) { wrong = {}; saveWrong(); delete t.dataset.armed; t.textContent = '오답 노트 비우기'; }
      else {
        t.dataset.armed = '1'; t.textContent = '한 번 더 누르면 비워요';
        setTimeout(function () { if (t.dataset.armed) { delete t.dataset.armed; t.textContent = '오답 노트 비우기'; } }, 3000);
        return;
      }
    } else if (t.dataset.dir) cfg.dir = t.dataset.dir;
    else if (t.dataset.count !== undefined) cfg.count = +t.dataset.count;
    else if (t.dataset.time !== undefined) cfg.time = +t.dataset.time;
    else if (t.id === 'start') { startSession(getPool(), cfg.count); return; }
    renderSetup();
  });

  /* ---------- session ---------- */
  function startSession(pool, limit) {
    var qs = shuffle(pool);
    if (limit) qs = qs.slice(0, limit);
    S = { qs: qs, i: 0, score: 0, streak: 0, best: 0, bad: [], t0: Date.now(), answered: false, adv: null, dir: cfg.dir, fromNotebook: cfg.notebook, limit: limit };
    show('play');
    renderQ();
  }

  function distractors(t, n, label, banned) {
    var ok = function (e) { return e !== t && !banned(e); };
    var same = shuffle(ALL.filter(function (e) { return ok(e) && e.snd === t.snd; }));
    var inRange = shuffle(ALL.filter(function (e) { return ok(e) && e.snd !== t.snd && (cfg.notebook || cfg.files[e.f]); }));
    var rest = shuffle(ALL.filter(ok));
    var out = [], seen = {};
    seen[label(t)] = 1;
    function add(e) { var l = label(e); if (out.length < n && !seen[l]) { seen[l] = 1; out.push(e); } }
    same.slice(0, 2).forEach(add);
    inRange.forEach(add);
    rest.forEach(add);
    return out;
  }

  function renderQ() {
    var q = S.qs[S.i];
    S.answered = false;
    $('#pn').textContent = S.i + 1;
    $('#pt').textContent = S.qs.length;
    $('#ps').textContent = S.score;
    $('#pbar').style.width = (S.i / S.qs.length * 100) + '%';
    var st = $('#pstreak');
    if (S.streak >= 3) { st.hidden = false; st.textContent = S.streak + '연속'; } else st.hidden = true;
    $('#fb').innerHTML = '';
    var opts, shown;

    if (S.dir === 'h2m') {
      var tAlts = {}; q.alts.forEach(function (a) { tAlts[a] = 1; });
      var ds = distractors(q, 3, function (e) { return e.alts[0]; }, function (e) { return tAlts[e.alts[0]] || e.alts.some(function (a) { return tAlts[a]; }); });
      opts = shuffle([q].concat(ds));
      $('#qcard').innerHTML = '<p class="q-label">뜻과 음을 고르세요</p><div class="mi"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100" vector-effect="non-scaling-stroke"/></g></svg><span class="g">' + q.h + '</span></div>';
      $('#opts').className = 'opts';
      $('#opts').innerHTML = opts.map(function (e, k) {
        return '<button type="button" class="opt" data-k="' + e.h + '"><kbd>' + (k + 1) + '</kbd>' + e.alts[0] + '</button>';
      }).join('');
    } else {
      var uniq = q.alts.filter(function (a) { return altCount[a] === 1; });
      var pickFrom = uniq.length ? uniq : q.alts;
      shown = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      var ds2 = distractors(q, 3, function (e) { return e.h; }, function (e) { return e.alts.indexOf(shown) >= 0; });
      opts = shuffle([q].concat(ds2));
      $('#qcard').innerHTML = '<p class="q-label">이 뜻과 음에 맞는 한자는?</p><div class="mean">' + shown + '</div>';
      $('#opts').className = 'opts han';
      $('#opts').innerHTML = opts.map(function (e, k) {
        return '<button type="button" class="opt" data-k="' + e.h + '"><kbd>' + (k + 1) + '</kbd><span class="hg">' + e.h + '</span></button>';
      }).join('');
    }
    S.cur = q;
    startTimer();
  }

  /* timer */
  var raf = 0, tEnd = 0;
  function stopTimer() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function startTimer() {
    stopTimer();
    var wrap = $('#timer'), bar = $('#tbar');
    if (!cfg.time || !S) { wrap.hidden = true; return; }
    wrap.hidden = false;
    bar.classList.remove('low');
    bar.style.transform = 'scaleX(1)';
    var total = cfg.time * 1000;
    tEnd = performance.now() + total;
    var tick = function () {
      var left = tEnd - performance.now();
      var p = Math.max(0, left / total);
      bar.style.transform = 'scaleX(' + p + ')';
      bar.classList.toggle('low', p < 0.3);
      if (left <= 0) { raf = 0; answer(null); } else raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  function answer(key) {
    if (!S || S.answered) return;
    S.answered = true;
    stopTimer();
    var q = S.cur, ok = key === q.h;
    $$('.opt').forEach(function (b) {
      b.disabled = true;
      if (b.dataset.k === q.h) b.classList.add('is-correct');
      else if (b.dataset.k === key) b.classList.add('is-wrong');
      else b.classList.add('dim');
    });
    if (ok) {
      S.score++; S.streak++; if (S.streak > S.best) S.best = S.streak;
      if (S.fromNotebook && wrong[q.h]) { delete wrong[q.h]; saveWrong(); }
    } else {
      S.streak = 0; S.bad.push(q);
      wrong[q.h] = 1; saveWrong();
    }
    $('#ps').textContent = S.score;
    var last = S.i === S.qs.length - 1;
    var status = ok ? '<span class="fb-status ok">정답</span>' : '<span class="fb-status no">' + (key === null ? '시간 초과' : '오답') + '</span>';
    $('#fb').innerHTML = '<div class="fb-text">' + status + '<div class="fb-detail"><span class="g">' + q.h + '</span><span class="m">' + q.alts.join(' · ') + '</span></div></div>' +
      '<button type="button" class="primary small" id="next">' + (last ? '결과 보기' : '다음') + '</button>';
    $('#next').focus({ preventScroll: true });
    if (ok) S.adv = setTimeout(next, 900);
  }

  function next() {
    if (!S || !S.answered) return;
    S.answered = false;
    clearTimeout(S.adv);
    if (S.i >= S.qs.length - 1) { finish(); return; }
    S.i++;
    renderQ();
  }

  function fmt(ms) {
    var s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function finish() {
    stopTimer();
    var n = S.qs.length, pct = Math.round(S.score / n * 100);
    $('#r-pct').innerHTML = pct + '<small>%</small>';
    $('#r-frac').textContent = n + '문제 중 ' + S.score + '문제 정답';
    $('#r-ok').textContent = S.score;
    $('#r-time').textContent = fmt(Date.now() - S.t0);
    $('#r-best').textContent = S.best;
    var box = $('#r-wrong-box');
    if (S.bad.length) {
      box.innerHTML = '<p class="label">틀린 한자 ' + S.bad.length + '자</p><div class="wrong-grid">' + S.bad.map(function (e) {
        return '<div class="w"><span class="g">' + e.h + '</span><span class="m">' + e.alts.join(' · ') + '</span></div>';
      }).join('') + '</div>';
    } else {
      box.innerHTML = '<p class="perfect">모두 맞혔어요. 범위를 넓히거나 제한 시간을 줄여 보세요.</p>';
    }
    $('#r-retry-wrong').hidden = S.bad.length === 0;
    show('result');
  }

  $('#opts').addEventListener('click', function (ev) {
    var b = ev.target.closest('.opt');
    if (b && !b.disabled) answer(b.dataset.k);
  });
  $('#fb').addEventListener('click', function (ev) { if (ev.target.closest('#next')) next(); });
  $('#quit').addEventListener('click', function () {
    stopTimer(); if (S) clearTimeout(S.adv); S = null; renderSetup(); show('setup');
  });
  $('#r-home').addEventListener('click', function () { S = null; renderSetup(); show('setup'); });
  $('#r-again').addEventListener('click', function () { startSession(S.fromNotebook ? ALL.filter(function (e) { return wrong[e.h]; }) : getPoolFromSession(), S.limit); });
  function getPoolFromSession() { return cfg.notebook ? getPool() : ALL.filter(function (e) { return cfg.files[e.f]; }); }
  $('#r-retry-wrong').addEventListener('click', function () { var bad = S.bad.slice(); startSession(bad, 0); });

  document.addEventListener('keydown', function (ev) {
    if (!S || screens.play.hidden || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!S.answered && /^[1-4]$/.test(ev.key)) {
      var b = $$('.opt')[+ev.key - 1];
      if (b) { ev.preventDefault(); answer(b.dataset.k); }
    } else if (S.answered && (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowRight')) {
      ev.preventDefault(); next();
    }
  });

  renderSetup();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
